name: Bug
description: Something broken, slow, or hard to read
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 130
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and screen
      placeholder: e.g. Chromebook, school projector, MacBook
